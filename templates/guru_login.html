<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Guru - SMKN 1 Bengkalis</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Eksternal Guru -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/guru.css') }}">
</head>
<body class="guru-bg">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card login-card border-0 p-4 bg-white shadow-lg rounded-4">
                <div class="text-center mb-4">
                    <div class="badge bg-primary-subtle text-primary p-3 rounded-circle mb-3">
                        <i class="fa-solid fa-chalkboard-user fs-2"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Portal Guru</h4>
                    <p class="text-muted small">Kelola Data Nilai & FAQ Akademik</p>
                </div>

                <form id="guru-login-form" onsubmit="handleLoginGuru(event)">
                    <div class="mb-3">
                        <label for="nip" class="form-label small fw-semibold">NIP / ID Guru</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-id-card text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0 rounded-end-3" id="nip" placeholder="Masukkan NIP Anda" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="kata_sandi" class="form-label small fw-semibold">Kata Sandi</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0 rounded-end-3" id="kata_sandi" placeholder="Masukkan Kata Sandi" required>
                        </div>
                    </div>
                    
                    <div id="login-error" class="alert alert-danger d-none py-2 small rounded-3"></div>
                    
                    <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-semibold mt-2 shadow-sm">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Masuk Sekarang
                    </button>
                </form>

                <div class="text-center mt-4 pt-2 border-top">
                    <a href="/" class="text-decoration-none small text-muted">
                        <i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Chatbot Utama
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- JS Eksternal Login Guru -->
<script src="{{ url_for('static', filename='js/guru_login.js') }}"></script>
</body>
</html>
